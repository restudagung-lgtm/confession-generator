<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Ada yang mau aku bilang…</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/viewer.css">
</head>
<body>
  <main id="app">

    <!-- Memuat -->
    <section id="screen-loading" class="screen active" aria-live="polite">
      <p class="loading">Memuat… 💌</p>
    </section>

    <!-- Error / kedaluwarsa -->
    <section id="screen-error" class="screen">
      <h2 id="error-title"></h2>
      <p id="error-text"></p>
      <a class="btn btn-primary" href="index.html">Buat web confession sendiri</a>
    </section>

    <!-- Layar 1: Welcome -->
    <section id="screen-welcome" class="screen">
      <h1 id="welcome-title"></h1>
      <p id="welcome-text"></p>
      <p class="hint" id="welcome-hint"></p>
    </section>

    <!-- Layar 2: Input nama (hanya jika nama penerima tidak diisi pembuat) -->
    <section id="screen-name" class="screen">
      <h2 id="name-title"></h2>
      <form id="name-form" autocomplete="off">
        <input type="text" id="name-input" maxlength="30" required placeholder="Ketik namamu di sini">
        <button type="submit" class="btn btn-primary">Kirim</button>
      </form>
      <p class="error" id="name-error" role="alert"></p>
    </section>

    <!-- Pengantar: kalimat muncul satu per satu -->
    <section id="screen-intro" class="screen">
      <p id="intro-line" class="intro-line"></p>
      <p class="hint">Ketuk untuk lanjut</p>
    </section>

    <!-- Mini game -->
    <section id="screen-game" class="screen">
      <h2 id="game-title"></h2>
      <p id="game-hint" class="game-hint"></p>
      <div id="game-area" class="game-area"></div>
      <button type="button" id="game-skip" class="btn btn-secondary game-skip" hidden>Lewati game ➜</button>
    </section>

    <!-- Layar 3: Pertanyaan -->
    <section id="screen-question" class="screen">
      <h2 id="question-text"></h2>
      <div class="buttons">
        <button type="button" class="btn btn-primary" id="btn-yes"></button>
        <button type="button" class="btn btn-secondary" id="btn-no"></button>
      </div>
    </section>

    <!-- Layar 4: Ucapan, foto utama, surat, galeri -->
    <section id="screen-success" class="screen">
      <figure id="hero" class="hero" hidden>
        <img id="hero-img" alt="Foto utama">
        <figcaption id="hero-caption"></figcaption>
      </figure>
      <h2 id="success-title"></h2>
      <p id="success-text"></p>

      <article id="letter" class="letter" hidden>
        <h3 id="letter-title"></h3>
        <div id="letter-body"></div>
        <p id="letter-sign" class="sign"></p>
      </article>

      <h3 id="gallery-title" class="gallery-title" hidden></h3>
      <div id="gallery" class="gallery" hidden></div>

      <a id="wa-btn" class="btn btn-primary" target="_blank" rel="noopener" hidden></a>
    </section>

  </main>

  <div id="lightbox" class="lightbox" hidden role="dialog" aria-modal="true" aria-label="Foto besar">
    <button type="button" id="lightbox-close" class="lightbox-close" aria-label="Tutup">✕</button>
    <figure>
      <img id="lightbox-img" alt="">
      <figcaption id="lightbox-caption"></figcaption>
    </figure>
  </div>

  <button type="button" id="music-toggle" class="music-toggle" aria-label="Nyalakan atau matikan musik" hidden>🔊</button>
  <div id="hearts" aria-hidden="true"></div>

  <script type="module" src="js/viewer.js"></script>
</body>
</html>
